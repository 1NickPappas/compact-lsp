name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test --all-features

  compiler-probe:
    name: Compiler probe (toolchain ${{ matrix.compact }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mainnet pin plus the ledger-9 release candidates. Each toolchain
        # probes the symbols that its language version should support.
        compact: ['0.31.1', '0.34.0', '0.35.0']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The registry probe tests skip themselves when no compiler is found.
      # Install the mainnet toolchain so they actually run and catch
      # registry-vs-compiler drift.
      - name: Install Compact devtools and toolchain ${{ matrix.compact }}
        # Authenticate the release lookup: `compact update` queries the GitHub
        # API, and unauthenticated requests are rate-limited (this broke the
        # third matrix leg when all three jobs installed a toolchain at once).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update ${{ matrix.compact }}
          "$HOME/.local/bin/compact" compile --version
          "$HOME/.local/bin/compact" compile --language-version

      - name: Probe registry against the detected compiler
        run: cargo test -p compact-analyzer probe -- --nocapture

      # Run the whole suite (unit + end-to-end + compiler-backed) against the
      # installed toolchain. The REQUIRE flags make a missing compiler or
      # formatter a hard failure instead of a silent skip, so these legs can
      # never pass without exercising the real binaries.
      - name: Run the full suite against the detected compiler
        env:
          COMPACT_LSP_REQUIRE_COMPILER: "1"
          COMPACT_LSP_REQUIRE_FORMATTER: "1"
        run: cargo test --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # No toolchain is installed, so compiler-backed tests skip and the
      # report measures the unit + end-to-end layers. Report-only for now.
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
