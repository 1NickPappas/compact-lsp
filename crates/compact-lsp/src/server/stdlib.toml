# ── Hash and commitment ──────────────────────────────────────────────

[[circuits]]
name = "transientHash"
type_params = "<T>"
signature = "transientHash<T>(value: T): Field"
snippet = "transientHash(${1:value})"
doc = "Circuit-efficient hash. Output is not guaranteed to be persistent across compiler versions."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "transientCommit"
type_params = "<T>"
signature = "transientCommit<T>(value: T, rand: Field): Field"
snippet = "transientCommit(${1:value}, ${2:rand})"
doc = "Circuit-efficient commitment function. Not guaranteed persistent across compiler versions."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[circuits]]
name = "persistentHash"
type_params = "<T>"
