# Compact standard library type and circuit registry.
#
# This file defines all struct types and circuit functions available via
# `import CompactStandardLibrary;`.  It is embedded at compile time
# (include_str!) and parsed once on first access.
#
# Baseline target: Compact language 0.23.0 (toolchain 0.31.1, the mainnet pin).
# Transcribed from the compiler's standard-library.compact (signatures +
# snake_case field names) and the CompactStandardLibrary API reference for
# compiler intrinsics. Symbols added after 0.23.0 carry `min_language_version`
# and are gated at presentation time against the detected compiler.
#
# Reference: https://docs.midnight.network/develop/reference/compact/compact-std-library/exports

# ── Maybe ────────────────────────────────────────────────────────────

[[structs]]
name = "Maybe"
type_params = "<T>"
description = "Optional container that may or may not hold a value of type T."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "is_some"
type_str = "Boolean"
doc = "Whether the container holds a value."

[[structs.fields]]
name = "value"
type_str = "T"
doc = "The contained value (meaningful only when is_some is true)."

# ── Either ───────────────────────────────────────────────────────────

[[structs]]
name = "Either"
type_params = "<A, B>"
description = "Union type that holds a value of type A (left) or type B (right)."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "is_left"
type_str = "Boolean"
doc = "Whether this holds the left variant."

[[structs.fields]]
name = "left"
type_str = "A"
doc = "The left variant value (meaningful only when is_left is true)."

[[structs.fields]]
name = "right"
type_str = "B"
doc = "The right variant value (meaningful only when is_left is false)."

# ── JubjubPoint ──────────────────────────────────────────────────────

[[structs]]
name = "JubjubPoint"
type_params = ""
description = "Opaque point on the embedded Jubjub elliptic curve (new type alias of Opaque<'JubjubPoint'>). Produced/consumed by the ec* circuits."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"
fields = []

# ── MerkleTreeDigest ─────────────────────────────────────────────────

[[structs]]
name = "MerkleTreeDigest"
type_params = ""
description = "Merkle tree root digest used with `checkRoot()` for membership verification."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "field"
type_str = "Field"
doc = "The digest value as a field element."

# ── MerkleTreePathEntry ──────────────────────────────────────────────

[[structs]]
name = "MerkleTreePathEntry"
type_params = ""
description = "A single entry in a Merkle tree path proof."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "sibling"
type_str = "MerkleTreeDigest"
doc = "The sibling digest at this level of the tree."

[[structs.fields]]
name = "goes_left"
type_str = "Boolean"
doc = "Whether this node is the left child at this level."

# ── MerkleTreePath ───────────────────────────────────────────────────

[[structs]]
name = "MerkleTreePath"
type_params = "<#n, T>"
description = "A Merkle tree inclusion proof containing the leaf and path entries."
doc_url = "https://docs.midnight.network/develop/reference/compact/compact-std-library/exports"

[[structs.fields]]
name = "leaf"
type_str = "T"
doc = "The leaf value being proven."

[[structs.fields]]
name = "path"
type_str = "Vector<n, MerkleTreePathEntry>"
doc = "The path from the leaf to the root."

