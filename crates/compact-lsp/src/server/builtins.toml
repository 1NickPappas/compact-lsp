[[types.methods]]
name = "remove"
signature = "remove(key: K)"
snippet = "remove(${1:key})"
doc = "Remove a key-value pair."

[[types.methods]]
name = "lookup"
signature = "lookup(key: K): V"
snippet = "lookup(${1:key})"
doc = "Look up the value for a given key."

[[types.methods]]
name = "member"
signature = "member(key: K): Boolean"
snippet = "member(${1:key})"
doc = "Check if a key exists in the map."

[[types.methods]]
name = "isEmpty"
signature = "isEmpty(): Boolean"
snippet = "isEmpty()"
doc = "Check if the map is empty."

[[types.methods]]
name = "size"
signature = "size(): Uint<64>"
snippet = "size()"
doc = "Get the number of entries in the map."

[[types.methods]]
name = "resetToDefault"
signature = "resetToDefault()"
snippet = "resetToDefault()"
doc = "Clear the map to empty."

