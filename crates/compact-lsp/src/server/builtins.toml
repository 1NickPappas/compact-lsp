doc_url = "https://docs.midnight.network/develop/reference/compact/ledger-adt"

[[types.methods]]
name = "insert"
signature = "insert(item: T)"
snippet = "insert(${1:item})"
doc = "Insert a leaf at the first free index."

[[types.methods]]
name = "insertIndex"
signature = "insertIndex(item: T, index: Uint<64>)"
snippet = "insertIndex(${1:item}, ${2:index})"
doc = "Insert a leaf at a specific index."

[[types.methods]]
name = "insertHash"
signature = "insertHash(hash: Bytes<32>)"
snippet = "insertHash(${1:hash})"
doc = "Insert a hash digest at the first free index."

[[types.methods]]
name = "insertHashIndex"
signature = "insertHashIndex(hash: Bytes<32>, index: Uint<64>)"
snippet = "insertHashIndex(${1:hash}, ${2:index})"
doc = "Insert a hash digest at a specific index."

[[types.methods]]
name = "insertIndexDefault"
signature = "insertIndexDefault(index: Uint<64>)"
snippet = "insertIndexDefault(${1:index})"
doc = "Insert default value at index (emulates removal)."

[[types.methods]]
name = "checkRoot"
signature = "checkRoot(root: MerkleTreeDigest): Boolean"
snippet = "checkRoot(${1:root})"
doc = "Validate a root against the current Merkle root."

[[types.methods]]
name = "isFull"
signature = "isFull(): Boolean"
snippet = "isFull()"
doc = "Check if the tree is at capacity."

[[types.methods]]
name = "resetToDefault"
signature = "resetToDefault()"
snippet = "resetToDefault()"
doc = "Clear the tree to empty."

