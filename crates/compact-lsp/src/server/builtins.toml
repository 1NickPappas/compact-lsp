# ── Kernel ───────────────────────────────────────────────────────────

[[types]]
name = "Kernel"
description = "Built-in runtime operations available in all contracts."
doc_url = "https://docs.midnight.network/develop/reference/compact/ledger-adt"

[[types.methods]]
name = "self"
signature = "self(): ContractAddress"
snippet = "self()"
doc = "Return the current contract's address."

[[types.methods]]
name = "caller"
min_language_version = "0.26.105"
signature = "caller(): Maybe<PublicAddress>"
snippet = "caller()"
doc = "Return the caller of this circuit invocation as Maybe<PublicAddress>: left(contract), right(user), or none when unknown. Requires language 0.26.105+."

[[types.methods]]
name = "balance"
signature = "balance(token_type: Either<Bytes<32>, Bytes<32>>): Uint<128>"
snippet = "balance(${1:token_type})"
doc = "Return the contract's balance of the given unshielded token type (fixed at start of execution)."

[[types.methods]]
name = "balanceGreaterThan"
signature = "balanceGreaterThan(token_type: Either<Bytes<32>, Bytes<32>>, amount: Uint<128>): Boolean"
snippet = "balanceGreaterThan(${1:token_type}, ${2:amount})"
doc = "Check whether the unshielded balance of the given token type is greater than the amount."

[[types.methods]]
name = "balanceLessThan"
signature = "balanceLessThan(token_type: Either<Bytes<32>, Bytes<32>>, amount: Uint<128>): Boolean"
snippet = "balanceLessThan(${1:token_type}, ${2:amount})"
doc = "Check whether the unshielded balance of the given token type is less than the amount."

[[types.methods]]
name = "mintShielded"
signature = "mintShielded(domain_sep: Bytes<32>, amount: Uint<64>)"
snippet = "mintShielded(${1:domain_sep}, ${2:amount})"
doc = "Create shielded coins with a contract-derived token type."

[[types.methods]]
name = "mintUnshielded"
signature = "mintUnshielded(domain_sep: Bytes<32>, amount: Uint<64>)"
snippet = "mintUnshielded(${1:domain_sep}, ${2:amount})"
doc = "Create unshielded coins with a contract-derived token type."

[[types.methods]]
name = "blockTimeGreaterThan"
signature = "blockTimeGreaterThan(time: Uint<64>): Boolean"
snippet = "blockTimeGreaterThan(${1:time})"
doc = "Check if the current block time exceeds a given timestamp."

[[types.methods]]
name = "blockTimeLessThan"
signature = "blockTimeLessThan(time: Uint<64>): Boolean"
snippet = "blockTimeLessThan(${1:time})"
doc = "Check if the current block time is before a given timestamp."

[[types.methods]]
name = "checkpoint"
signature = "checkpoint()"
snippet = "checkpoint()"
doc = "Mark execution as an atomic unit for partial rollback."

[[types.methods]]
name = "claimContractCall"
signature = "claimContractCall(addr: Bytes<32>, entry_point: Bytes<32>, comm: Field)"
snippet = "claimContractCall(${1:addr}, ${2:entry_point}, ${3:comm})"
