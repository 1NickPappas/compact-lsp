# Built-in type method registry for Compact.
#
# This file defines all methods available on Compact's built-in ledger and
# runtime types. It is embedded at compile time (include_str!) and parsed
# once on first access.
#
# To add a new method, append a [[types.methods]] entry under the
# appropriate [[types]] block. Order matters — methods appear in
# completion lists in the order listed here.

# ── Counter ──────────────────────────────────────────────────────────

[[types]]
name = "Counter"
description = "Simple incrementing/decrementing counter for ledger state."
doc_url = "https://docs.midnight.network/develop/reference/compact/ledger-adt"

[[types.methods]]
name = "increment"
signature = "increment(amount: Uint<16>)"
snippet = "increment(${1:amount})"
doc = "Increment the counter by the given amount."

[[types.methods]]
name = "decrement"
signature = "decrement(amount: Uint<16>)"
snippet = "decrement(${1:amount})"
doc = "Decrement the counter by the given amount."

[[types.methods]]
name = "read"
signature = "read(): Uint<64>"
snippet = "read()"
doc = "Retrieve the current counter value."

[[types.methods]]
name = "lessThan"
signature = "lessThan(threshold: Uint<64>): Boolean"
snippet = "lessThan(${1:threshold})"
doc = "Check if the counter is less than a threshold."

[[types.methods]]
name = "resetToDefault"
signature = "resetToDefault()"
snippet = "resetToDefault()"
doc = "Reset the counter to zero."

# ── Cell ─────────────────────────────────────────────────────────────

[[types]]
name = "Cell"
description = "Mutable single-value container for ledger state."
doc_url = "https://docs.midnight.network/develop/reference/compact/ledger-adt"

[[types.methods]]
name = "read"
signature = "read(): T"
snippet = "read()"
doc = "Retrieve the current value of the cell."

[[types.methods]]
name = "write"
signature = "write(value: T)"
snippet = "write(${1:value})"
doc = "Overwrite the cell contents."

[[types.methods]]
name = "writeCoin"
signature = "writeCoin(coin: ShieldedCoinInfo, recipient: Either<ZswapCoinPublicKey, ContractAddress>)"
snippet = "writeCoin(${1:coin}, ${2:recipient})"
doc = "Write a coin value to the cell, transferring the coin to the recipient."

[[types.methods]]
name = "resetToDefault"
signature = "resetToDefault()"
snippet = "resetToDefault()"
doc = "Reset to the type's default value."

# ── Map ──────────────────────────────────────────────────────────────

[[types]]
