snippet = "claimZswapCoinReceive(${1:note})"
doc = "Claim a Zswap coin receive commitment."

[[types.methods]]
name = "claimZswapCoinSpend"
signature = "claimZswapCoinSpend(note: Bytes<32>)"
snippet = "claimZswapCoinSpend(${1:note})"
doc = "Claim a Zswap coin spend commitment."

[[types.methods]]
name = "claimZswapNullifier"
signature = "claimZswapNullifier(nul: Bytes<32>)"
snippet = "claimZswapNullifier(${1:nul})"
doc = "Claim a Zswap nullifier."

[[types.methods]]
name = "claimUnshieldedCoinSpend"
signature = "claimUnshieldedCoinSpend(token_type: Either<Bytes<32>, Bytes<32>>, address: Either<ContractAddress, UserAddress>, amount: Uint<128>)"
snippet = "claimUnshieldedCoinSpend(${1:token_type}, ${2:address}, ${3:amount})"
doc = "Claim spending of an unshielded coin in the containing transaction."

[[types.methods]]
name = "incUnshieldedInputs"
signature = "incUnshieldedInputs(token_type: Either<Bytes<32>, Bytes<32>>, amount: Uint<128>)"
snippet = "incUnshieldedInputs(${1:token_type}, ${2:amount})"
doc = "Increase the recorded unshielded inputs for the given token type."

[[types.methods]]
name = "incUnshieldedOutputs"
signature = "incUnshieldedOutputs(token_type: Either<Bytes<32>, Bytes<32>>, amount: Uint<128>)"
snippet = "incUnshieldedOutputs(${1:token_type}, ${2:amount})"
doc = "Increase the recorded unshielded outputs for the given token type."
